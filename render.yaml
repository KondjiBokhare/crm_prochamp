
databases:
  - name: crm-prochamp-db
    region: singapore
    plan: free
    databaseName: techgear_crm
    user: techgear_crm

services:
  # Redis-compatible cache
  - type: keyvalue
    name: crm-prochamp-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # Django API
  - type: web
    name: crm-prochamp-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    # preDeployCommand: python manage.py migrate --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    autoDeployTrigger: checksPass

    # disk:
    #   name: crm-profile-media
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: JWT_SIGNING_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: crm-prochamp-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: crm-prochamp-cache
          type: keyvalue
          property: connectionString
      
      - key: STOREFRONT_ORGANIZATION_ID
        value: "1"

      - key: MEDIA_ROOT
        value: /tmp/media

      - key: CORS_ALLOWED_ORIGINS
        value: https://crm-prochamp-frontend.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://crm-prochamp-frontend.onrender.com

  # React + Vite
  - type: web
    name: crm-prochamp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        value: https://crm-prochamp-api.onrender.com

      - key: VITE_AUTH_MODE
        value: api

      - key: VITE_STOREFRONT_AUTH_MODE
        value: api

      - key: VITE_STOREFRONT_ACCOUNT_MODE
        value: api

      - key: VITE_STOREFRONT_ORDERS_MODE
        value: api

      - key: VITE_STOREFRONT_CART_MODE
        value: api

      - key: VITE_STOREFRONT_WISHLIST_MODE
        value: api

      - key: VITE_STOREFRONT_COUPONS_MODE
        value: api

      - key: VITE_STOREFRONT_REVIEWS_MODE
        value: api

      - key: VITE_STOREFRONT_SUPPORT_MODE
        value: api

      # Keep legacy CRM adapters in demo mode during initial deployment.
           # Production: CRM data must come from Django APIs.
      - key: VITE_CRM_DATA_MODE
        value: api

      - key: VITE_CRM_CUSTOMERS_MODE
        value: api
      - key: VITE_CRM_ORDERS_MODE
        value: api
      - key: VITE_CRM_SEGMENTS_MODE
        value: api
      - key: VITE_CRM_CAMPAIGNS_MODE
        value: api
      - key: VITE_CRM_INTERACTIONS_MODE
        value: api
      - key: VITE_CRM_ANALYTICS_MODE
        value: api
      - key: VITE_CRM_CAMPAIGN_RESPONSES_MODE
        value: api
      - key: VITE_CRM_AUDIT_LOGS_MODE
        value: api
      - key: VITE_CRM_PRODUCTS_MODE
        value: api
      - key: VITE_CRM_CATEGORIES_MODE
        value: api
      - key: VITE_CRM_SUPPORT_MODE
        value: api
      - key: VITE_CRM_LEADS_MODE
        value: api
      - key: VITE_CRM_BANNERS_MODE
        value: api
      - key: VITE_CRM_HOMEPAGE_PROMOTIONS_MODE
        value: api
      - key: VITE_CRM_INVENTORY_MODE
        value: api
      - key: VITE_CRM_COUPONS_MODE
        value: api
      - key: VITE_CRM_ABANDONED_CARTS_MODE
        value: api
      - key: VITE_CRM_SHIPMENTS_MODE
        value: api
      - key: VITE_CRM_RETURNS_MODE
        value: api
      - key: VITE_CRM_ORDER_ACTIVITY_MODE
        value: api
      - key: VITE_CRM_STAFF_USERS_MODE
        value: api
      - key: VITE_CRM_COMMUNICATIONS_MODE
        value: api
      - key: VITE_CRM_STOREFRONT_SETTINGS_MODE
        value: api
      - key: VITE_CRM_BEHAVIOR_EVENTS_MODE
        value: api
      - key: VITE_CRM_BEHAVIOR_ANALYTICS_MODE
        value: api
      - key: VITE_CRM_RECOMMENDATIONS_MODE
        value: api
