
databases:
  - name: crm-prochamp-db
    region: singapore
    plan: free
    databaseName: techgear_crm
    user: techgear_crm

services:
  # Redis-compatible cache
  - type: keyvalue
    name: crm-prochamp-cache
    region: singapore
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  # Django API
  - type: web
    name: crm-prochamp-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    autoDeployTrigger: checksPass

    # disk:
    #   name: crm-profile-media
    #   mountPath: /var/data
    #   sizeGB: 1

    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: JWT_SIGNING_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        fromDatabase:
          name: crm-prochamp-db
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: crm-prochamp-cache
          type: keyvalue
          property: connectionString

      - key: MEDIA_ROOT
        value: /var/data/media

      - key: CORS_ALLOWED_ORIGINS
        value: https://crm-prochamp-frontend.onrender.com

      - key: CSRF_TRUSTED_ORIGINS
        value: https://crm-prochamp-frontend.onrender.com

  # React + Vite
  - type: web
    name: crm-prochamp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        value: https://crm-prochamp-api.onrender.com

      - key: VITE_AUTH_MODE
        value: api

      - key: VITE_STOREFRONT_AUTH_MODE
        value: api

      - key: VITE_STOREFRONT_ACCOUNT_MODE
        value: api

      - key: VITE_STOREFRONT_ORDERS_MODE
        value: api

      - key: VITE_STOREFRONT_CART_MODE
        value: api

      - key: VITE_STOREFRONT_WISHLIST_MODE
        value: api

      - key: VITE_STOREFRONT_COUPONS_MODE
        value: api

      - key: VITE_STOREFRONT_REVIEWS_MODE
        value: api

      - key: VITE_STOREFRONT_SUPPORT_MODE
        value: api

      # Keep legacy CRM adapters in demo mode during initial deployment.
      - key: VITE_CRM_DATA_MODE
        value: mock
